[platformio]
data_dir = gifs

[env:um_pros3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = um_pros3
framework = arduino
monitor_speed = 115200

board_build.filesystem = spiffs

lib_deps =
  lovyan03/LovyanGFX
  bitbank2/AnimatedGIF

build_flags =
  ; If your panel needs offsets, set them here (common for 170x320 is X=35, Y=0)
  -D TFT_OFFSET_X=35
  -D TFT_OFFSET_Y=0
  ; Share SPI MISO for SD card reads (TFT itself is write-only).
  -D TFT_MISO=37
  ; SD card CS pin (avoid ESP32-S3 strapping pins like GPIO3 if possible).
  -D SD_CS=15
  ; 0 = quiet (default), 1 = verbose serial logs
  -D GIFPLAYER_DEBUG=0
  ; AnimatedGIF defaults to MAX_WIDTH=480 on MCUs; many web GIFs are 500px wide.
  -UMAX_WIDTH
  -D MAX_WIDTH=1024