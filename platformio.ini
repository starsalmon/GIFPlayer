[platformio]
data_dir = gifs

[env:um_pros3]
platform = espressif32@55.3.36
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6.tar.xz
    platformio/framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz
board = um_pros3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/patch_animatedgif.py

board_build.filesystem = spiffs

lib_deps =
  lovyan03/LovyanGFX
  bitbank2/AnimatedGIF

build_flags =
  ; If your panel needs offsets, set them here (common for 170x320 is X=35, Y=0)
  -D TFT_OFFSET_X=35
  -D TFT_OFFSET_Y=0
  ; Share SPI MISO for SD card reads (TFT itself is write-only).
  -D TFT_MISO=37
  ; SD card CS pin (avoid ESP32-S3 strapping pins like GPIO3 if possible).
  -D SD_CS=15
  ; SD SPI clock (kHz). Falls back to 20/4 MHz if mount fails.
  -D SD_SPI_FREQ_KHZ=40000
  ; 0 = quiet (default), 1 = verbose serial logs
  -D GIFPLAYER_DEBUG=1
  ; AnimatedGIF defaults to MAX_WIDTH=480 on MCUs; many web GIFs are 500px wide.
  -D MAX_WIDTH=1024